name: Hourly AQI Feature Pipeline

on:
  workflow_dispatch:   # lets you trigger it manually from the GitHub UI
jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python main.py

      - name: Commit updated Feast data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add aqi_feature_repo/feature_repo/data/hourly_city_aqi.parquet
          git commit -m "Add hourly AQI row (Feast)" || echo "No changes to commit"
          git push
